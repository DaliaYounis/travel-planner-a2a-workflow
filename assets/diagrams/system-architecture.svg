<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">System architecture</title><desc id="desc">Six local processes; the orchestrator connects the browser and three agents. Search uses MCP and SerpAPI. All three agents use OpenAI.</desc>
<defs><linearGradient id="bar"><stop stop-color="#7c3aed"/><stop offset=".45" stop-color="#2563eb"/><stop offset=".75" stop-color="#06b6d4"/><stop offset="1" stop-color="#22c55e"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="#7dd3fc"/></marker><clipPath id="card"><rect width="1440" height="810" rx="28"/></clipPath></defs>
<g clip-path="url(#card)" font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="810" fill="#070d18"/><rect width="1440" height="6" fill="url(#bar)"/><text x="48" y="57" fill="#f8fafc" font-size="28" text-anchor="start" font-weight="700">System architecture</text><rect x="70" y="100" width="340" height="108" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/><text x="240" y="134" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">React client</text><text x="240" y="163" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Trip form · agent board</text><text x="240" y="188" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Protocol log · itinerary</text><rect x="70" y="326" width="340" height="118" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="240" y="360" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Orchestrator</text><text x="240" y="389" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Validate · discover · poll</text><text x="240" y="414" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Score plan · emit SSE</text><path d="M210 208 V326" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="193" y="259" fill="#7dd3fc" font-size="16" text-anchor="end" font-weight="400">POST</text><path d="M280 326 V208" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="298" y="282" fill="#7dd3fc" font-size="16" text-anchor="start" font-weight="400">SSE</text><path d="M410 385 H468 V157 H525" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M468 385 H525" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M468 385 V617 H525" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="737" fill="#c4b5fd" font-size="17" text-anchor="middle" font-weight="400">A2A: cards + SendMessage + GetTask</text><rect x="525" y="100" width="340" height="114" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/><text x="695" y="134" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Search agent</text><text x="695" y="163" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Research findings</text><text x="695" y="188" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">MCP client + model</text><rect x="525" y="326" width="340" height="118" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/><text x="695" y="360" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Budget agent</text><text x="695" y="389" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Group category estimates</text><text x="695" y="414" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Calculated totals</text><rect x="525" y="558" width="340" height="118" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><text x="695" y="592" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Itinerary agent</text><text x="695" y="621" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Search + budget + request</text><text x="695" y="646" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Validated daily plan</text><path d="M865 154 H1010" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="937" y="140" fill="#7dd3fc" font-size="16" text-anchor="middle" font-weight="400">MCP</text><rect x="1010" y="100" width="350" height="100" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/><text x="1185" y="134" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">MCP server</text><text x="1185" y="163" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">web_search · /mcp</text><path d="M1185 200 V257" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1010" y="257" width="350" height="100" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/><text x="1185" y="291" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">SerpAPI</text><text x="1185" y="320" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Titles · links · snippets</text><path d="M865 193 H917 V531 H1010" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M865 385 H942 V557 H1010" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M865 617 H968 V583 H1010" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1010" y="495" width="350" height="124" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="1185" y="529" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">OpenAI</text><text x="1185" y="558" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Structured generation</text><text x="1185" y="583" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Used by all three agents</text><text x="720" y="783" fill="#94a3b8" font-size="18" text-anchor="middle" font-weight="400">Agents exchange results through the orchestrator. There are no direct agent-to-agent calls.</text></g></svg>
