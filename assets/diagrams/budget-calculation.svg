<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
<title id="title">Estimated by the model. Calculated in code.</title><desc id="desc">Model supplies category estimates; code rounds and sums them, computes per-person cost and verdict, then itinerary preserves the result.</desc>
<defs><linearGradient id="bar"><stop stop-color="#7c3aed"/><stop offset=".45" stop-color="#2563eb"/><stop offset=".75" stop-color="#06b6d4"/><stop offset="1" stop-color="#22c55e"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="#7dd3fc"/></marker><clipPath id="card"><rect width="1440" height="610" rx="28"/></clipPath></defs>
<g clip-path="url(#card)" font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="610" fill="#070d18"/><rect width="1440" height="6" fill="url(#bar)"/><text x="48" y="57" fill="#f8fafc" font-size="28" text-anchor="start" font-weight="700">Estimated by the model. Calculated in code.</text><rect x="55" y="110" width="350" height="145" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="230" y="144" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Model estimates</text><text x="230" y="173" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Accommodation · food</text><text x="230" y="198" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Transport · activities · misc</text><text x="230" y="223" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">For the whole group</text><path d="M405 182 H545" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="545" y="110" width="350" height="145" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/><text x="720" y="144" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Code calculates</text><text x="720" y="173" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Round each category</text><text x="720" y="198" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Sum rounded categories</text><text x="720" y="223" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Round total / travelers</text><path d="M895 182 H1035" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1035" y="110" width="350" height="145" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><text x="1210" y="144" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Final budget</text><text x="1210" y="173" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Under / on / over budget</text><text x="1210" y="198" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Total + per-person + notes</text><text x="1210" y="223" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Attached to itinerary</text><rect x="100" y="318" width="1240" height="166" rx="18" fill="#10213b" stroke="#1e3a5f"/><text x="145" y="357" fill="#38bdf8" font-size="15" text-anchor="start" font-weight="700">ILLUSTRATIVE CALCULATION</text><text x="145" y="400" fill="#f8fafc" font-size="29" text-anchor="start" font-weight="700">$800 + $400 + $200 + $300 + $100 = $1,800</text><text x="145" y="447" fill="#94a3b8" font-size="22" text-anchor="start" font-weight="400">2 travelers → $900 each     |     $2,000 limit → Under budget by $200</text><text x="720" y="552" fill="#94a3b8" font-size="19" text-anchor="middle" font-weight="400">Budget runs independently of research. Its estimates are not live price quotations.</text></g></svg>
