<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
<title id="title">From a destination to research findings</title><desc id="desc">The search agent invokes web_search through MCP, receives up to five organic results and summarizes them with a model.</desc>
<defs><linearGradient id="bar"><stop stop-color="#7c3aed"/><stop offset=".45" stop-color="#2563eb"/><stop offset=".75" stop-color="#06b6d4"/><stop offset="1" stop-color="#22c55e"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="#7dd3fc"/></marker><clipPath id="card"><rect width="1440" height="640" rx="28"/></clipPath></defs>
<g clip-path="url(#card)" font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="640" fill="#070d18"/><rect width="1440" height="6" fill="url(#bar)"/><text x="48" y="57" fill="#f8fafc" font-size="28" text-anchor="start" font-weight="700">From a destination to research findings</text><rect x="55" y="110" width="350" height="120" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/><text x="230" y="144" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Search agent</text><text x="230" y="173" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Destination-based query</text><text x="230" y="198" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Calls web_search</text><path d="M405 170 H545" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="475" y="148" fill="#7dd3fc" font-size="15" text-anchor="middle" font-weight="400">MCP / HTTP</text><rect x="545" y="110" width="350" height="120" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="720" y="144" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">MCP server</text><text x="720" y="173" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Reusable search tool</text><text x="720" y="198" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">SerpAPI adapter</text><path d="M895 170 H1035" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="965" y="148" fill="#7dd3fc" font-size="15" text-anchor="middle" font-weight="400">HTTP</text><rect x="1035" y="110" width="350" height="120" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/><text x="1210" y="144" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">SerpAPI</text><text x="1210" y="173" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Google organic results</text><text x="1210" y="198" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">At most five results</text><path d="M1210 230 V295 H230 V365" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="720" y="280" fill="#7dd3fc" font-size="18" text-anchor="middle" font-weight="400">Return titles, links, and snippets through MCP</text><rect x="55" y="365" width="350" height="130" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="230" y="399" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Structured completion</text><text x="230" y="428" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Prompt uses search results</text><text x="230" y="453" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Missing prices: “Unknown”</text><text x="230" y="478" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">OpenAI + Zod</text><path d="M405 430 H545" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="545" y="365" width="350" height="130" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/><text x="720" y="399" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Validate findings</text><text x="720" y="428" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Required fields and lists</text><text x="720" y="453" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Requested destination</text><text x="720" y="478" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Structured schema</text><path d="M895 430 H1035" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1035" y="365" width="350" height="130" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><text x="1210" y="399" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Research artifact</text><text x="1210" y="428" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Attractions · hotels</text><text x="1210" y="453" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Transport options</text><text x="1210" y="478" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Summary</text><text x="720" y="579" fill="#94a3b8" font-size="18" text-anchor="middle" font-weight="400">image_search is available on the tool server, but is not called by the trip workflow.</text></g></svg>
