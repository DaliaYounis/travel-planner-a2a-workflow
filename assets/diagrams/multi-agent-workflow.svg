<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">One request, parallel specialists</title><desc id="desc">Input is validated and all cards discovered before parallel research and budget. Both must succeed before itinerary generation.</desc>
<defs><linearGradient id="bar"><stop stop-color="#7c3aed"/><stop offset=".45" stop-color="#2563eb"/><stop offset=".75" stop-color="#06b6d4"/><stop offset="1" stop-color="#22c55e"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="#7dd3fc"/></marker><clipPath id="card"><rect width="1440" height="790" rx="28"/></clipPath></defs>
<g clip-path="url(#card)" font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="790" fill="#070d18"/><rect width="1440" height="6" fill="url(#bar)"/><text x="48" y="57" fill="#f8fafc" font-size="28" text-anchor="start" font-weight="700">One request, parallel specialists</text><rect x="470" y="90" width="500" height="90" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="720" y="124" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Validate the trip request</text><text x="720" y="153" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Destination · days · group budget · travelers</text><path d="M720 180 V218" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="470" y="218" width="500" height="90" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="720" y="252" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Discover all three agents</text><text x="720" y="281" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Read cards sequentially</text><path d="M720 308 V345 H355 V379" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M720 345 H1085 V379" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="720" y="369" fill="#c4b5fd" font-size="15" text-anchor="middle" font-weight="700">RUN TOGETHER</text><rect x="100" y="379" width="510" height="105" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/><text x="355" y="413" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Search task</text><text x="355" y="442" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Web search → structured findings</text><rect x="830" y="379" width="510" height="105" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/><text x="1085" y="413" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Budget task</text><text x="1085" y="442" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Model estimates → calculated amounts</text><path d="M355 484 V526 H720 V563" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1085 484 V526 H720" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" /><text x="748" y="549" fill="#34d399" font-size="15" text-anchor="start" font-weight="700">BOTH COMPLETED + VALIDATED</text><rect x="470" y="563" width="500" height="95" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><text x="720" y="597" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Itinerary task</text><text x="720" y="626" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Original request + search + budget</text><path d="M720 658 V700" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="350" y="700" width="740" height="65" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="720" y="734" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Validate plan → score checks → stream result</text></g></svg>
