<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
<title id="title">A2A task lifecycle</title><desc id="desc">SendMessage stores working state immediately. Polling reads completed structured artifacts or failed text artifacts.</desc>
<defs><linearGradient id="bar"><stop stop-color="#7c3aed"/><stop offset=".45" stop-color="#2563eb"/><stop offset=".75" stop-color="#06b6d4"/><stop offset="1" stop-color="#22c55e"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1.5 9 5 0 8.5Z" fill="#7dd3fc"/></marker><clipPath id="card"><rect width="1440" height="620" rx="28"/></clipPath></defs>
<g clip-path="url(#card)" font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="620" fill="#070d18"/><rect width="1440" height="6" fill="url(#bar)"/><text x="48" y="57" fill="#f8fafc" font-size="28" text-anchor="start" font-weight="700">A2A task lifecycle</text><rect x="60" y="115" width="320" height="110" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="220" y="149" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">SendMessage</text><text x="220" y="178" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Structured data object</text><text x="220" y="203" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">A2A-Version: 1.0</text><path d="M380 170 H490" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="490" y="115" width="460" height="110" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/><text x="720" y="149" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">WORKING</text><text x="720" y="178" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Task ID returned immediately</text><text x="720" y="203" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Executor runs asynchronously</text><path d="M720 225 V290 H360 V340" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M720 290 H1080 V340" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="120" y="340" width="480" height="110" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/><text x="360" y="374" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">COMPLETED</text><text x="360" y="403" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Result artifact</text><text x="360" y="428" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">JSON object in a data part</text><rect x="840" y="340" width="480" height="110" rx="16" fill="#0b1220" stroke="#fb7185" stroke-width="2"/><text x="1080" y="374" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">FAILED</text><text x="1080" y="403" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Error artifact</text><text x="1080" y="428" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Message in a text part</text><text x="752" y="267" fill="#7dd3fc" font-size="18" text-anchor="start" font-weight="400">GetTask observes the stored state</text><text x="720" y="519" fill="#f8fafc" font-size="21" text-anchor="middle" font-weight="400">Poll interval: 400 ms  ·  Poll deadline: 120 s  ·  Per HTTP request: 15 s</text><text x="720" y="562" fill="#94a3b8" font-size="18" text-anchor="middle" font-weight="400">No agent cancel method. Accepted work can continue after browser cancellation.</text></g></svg>
