<g clip-path="url(#card)" font-family="Segoe UI, Arial, sans-serif"><rect width="1440" height="520" fill="#070d18"/><rect width="1440" height="6" fill="url(#bar)"/><text x="56" y="106" fill="#38bdf8" font-size="15" text-anchor="start" font-weight="700">TRAVEL PLANNING / MULTI-AGENT SYSTEM</text><text x="56" y="184" fill="#f8fafc" font-size="58" text-anchor="start" font-weight="700">Travel Planner</text><text x="56" y="247" fill="#f8fafc" font-size="36" text-anchor="start" font-weight="700">Three agents. One plan.</text><text x="56" y="294" fill="#94a3b8" font-size="20" text-anchor="start" font-weight="400">Live research, estimated costs, and a daily itinerary.</text><rect x="56" y="332" width="136" height="42" rx="21" fill="none" stroke="#a78bfa"/><text x="124" y="359" fill="#c4b5fd" font-size="14" text-anchor="middle" font-weight="700">A2A 1.0</text><rect x="206" y="332" width="106" height="42" rx="21" fill="none" stroke="#38bdf8"/><text x="259" y="359" fill="#c4b5fd" font-size="14" text-anchor="middle" font-weight="700">MCP</text><rect x="326" y="332" width="106" height="42" rx="21" fill="none" stroke="#38bdf8"/><text x="379" y="359" fill="#c4b5fd" font-size="14" text-anchor="middle" font-weight="700">SSE</text><rect x="446" y="332" width="210" height="42" rx="21" fill="none" stroke="#38bdf8"/><text x="551" y="359" fill="#c4b5fd" font-size="14" text-anchor="middle" font-weight="700">STRUCTURED JSON</text><text x="56" y="451" fill="#34d399" font-size="16" text-anchor="start" font-weight="700">RESEARCH → ESTIMATE → SYNTHESIZE</text><rect x="890" y="47" width="350" height="86" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/><text x="1065" y="81" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Orchestrator</text><text x="1065" y="110" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Validate · discover · coordinate</text><path d="M1065 133 V169 H870 V203" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1065 169 H1250 V203" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="735" y="203" width="270" height="100" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/><text x="870" y="237" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Search</text><text x="870" y="266" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">MCP + web results</text><rect x="1115" y="203" width="270" height="100" rx="16" fill="#0b1220" stroke="#34d399" stroke-width="2"/><text x="1250" y="237" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Budget</text><text x="1250" y="266" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Estimates + arithmetic</text><path d="M870 303 V345 H1065 V383" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1250 303 V345 H1065" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linejoin="round" /><rect x="890" y="383" width="350" height="94" rx="16" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/><text x="1065" y="417" fill="#f8fafc" font-size="22" text-anchor="middle" font-weight="700">Itinerary</text><text x="1065" y="446" fill="#94a3b8" font-size="17" text-anchor="middle" font-weight="400">Both results → daily schedule</text></g></svg>
